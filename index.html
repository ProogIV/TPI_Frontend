<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TPI E-commerce — Equipo 12</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 32px auto; padding: 0 16px; color: #222; }
    h1 { margin-bottom: 4px; }
    .sub { color: #666; margin-top: 0; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 16px 0; }
    input, select, button { padding: 8px; margin: 4px 4px 4px 0; font-size: 14px; }
    button { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; }
    .error { color: #b00020; }
    .ok { color: #0a7d32; }
    .estado-PAGADO { color: #0a7d32; font-weight: bold; }
    .estado-FALLIDO { color: #b00020; font-weight: bold; }
    .estado-PENDIENTE { color: #a66b00; font-weight: bold; }
    .oculto { display: none; }
    #notificaciones { position: fixed; top: 16px; right: 16px; width: 340px; z-index: 10; }
    .aviso { background: #fff; border: 1px solid #ddd; border-left: 6px solid currentColor;
             border-radius: 6px; padding: 10px 12px; margin-bottom: 8px;
             box-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
    #ws-estado { font-size: 13px; margin: 0 0 8px; }
  </style>
</head>
<body>
  <div id="notificaciones"></div>
  <h1>TPI E-commerce</h1>
  <p class="sub">Inventario (Express + MongoDB) · Pedidos (Django + PostgreSQL) · Pagos (FastAPI)</p>

  <section>
    <h2>Catálogo</h2>
    <table>
      <thead><tr><th>SKU</th><th>Producto</th><th>Precio</th><th>Stock</th></tr></thead>
      <tbody id="catalogo"></tbody>
    </table>
    <p id="catalogo-error" class="error"></p>
  </section>

  <section id="login-box">
    <h2>Ingresar</h2>
    <input id="username" placeholder="usuario" autocomplete="username">
    <input id="password" type="password" placeholder="contraseña" autocomplete="current-password">
    <button id="btn-login">Ingresar</button>
    <p id="login-error" class="error"></p>
  </section>

  <section id="app-box" class="oculto">
    <h2>Comprar <small id="usuario-actual"></small></h2>
    <p id="ws-estado"></p>
    <select id="producto"></select>
    <input id="cantidad" type="number" min="1" value="1" style="width: 80px">
    <button id="btn-comprar">Comprar</button>
    <button id="btn-salir">Salir</button>
    <p id="compra-resultado"></p>

    <h2>Mis pedidos</h2>
    <table>
      <thead><tr><th>#</th><th>Producto</th><th>Cant.</th><th>Total</th><th>Estado</th></tr></thead>
      <tbody id="pedidos"></tbody>
    </table>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
